name: Repair Premium PR #5 dependency lockfile

on:
  push:
    branches:
      - feature/premium-multiprofissional-foundation-20261117
    paths:
      - .github/workflows/repair-lockfile-pr5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.ref == 'refs/heads/feature/premium-multiprofissional-foundation-20261117'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Premium PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate package-lock.json from package.json
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Verify reproducible clean installation
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit only the verified lockfile to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: sync Premium lockfile and verify npm ci"
            git push origin HEAD:feature/premium-multiprofissional-foundation-20261117
          else
            echo "Lockfile already synchronized"
          fi
